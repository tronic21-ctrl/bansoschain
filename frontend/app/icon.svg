<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .chain { stroke: #1b1d1a; }
    .dot-outer { fill: #ffffff; stroke: #1b1d1a; }
    .dot-inner { fill: #1f6e5c; }
    @media (prefers-color-scheme: dark) {
      .chain { stroke: #f6f6f3; }
      .dot-outer { fill: #141513; stroke: #f6f6f3; }
      .dot-inner { fill: #4fb08e; }
    }
  </style>

  <!-- Micro interlocking chain modules -->
  <rect x="4" y="4" width="14" height="14" rx="3.5" 
        fill="none" class="chain" stroke-width="2.5" />
  <rect x="14" y="14" width="14" height="14" rx="3.5" 
        fill="none" class="chain" stroke-width="2.5" />

  <!-- Central audit point -->
  <circle cx="16" cy="16" r="4.5" class="dot-outer" stroke-width="0.8" />
  <circle cx="16" cy="16" r="2.8" class="dot-inner" />
</svg>
