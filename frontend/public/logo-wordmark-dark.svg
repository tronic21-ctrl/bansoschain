  <text x="100" y="44" font-family="'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="30" font-weight="600" letter-spacing="-0.5" fill="#f6f6f3">
    Ban<tspan fill="#4fb08e">SOS</tspan><tspan font-weight="400" fill="#f6f6f3">Chain</tspan>
  </text>

  <!-- Subtitle / Meta Tag -->
  <text x="101" y="63" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace" font-size="9.5" font-weight="500" letter-spacing="2" fill="#9b9e97">
